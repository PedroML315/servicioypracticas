services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicioypracticas_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:5.7
    container_name: servicioypracticas_mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: servicioypracticas_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_local
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Bandeja de correo de pruebas: con APP_ENV=pruebas todo correo llega aquí y nunca sale a internet.
  mailpit:
    image: axllent/mailpit
    container_name: servicioypracticas_mailpit
    environment:
      # Guarda los correos en disco para que no se pierdan al reiniciar Docker
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  mysql_data:
  mailpit_data: